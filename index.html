<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pagos de alquiler</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Karla:wght@400;500;700&display=swap');

  /* ---------------------------------------------------------------
     Paleta: cuaderno de alquiler. El fondo "kraft" es el folder,
     la tarjeta es la hoja del talonario, y el sello de tinta marca
     el estado de la cuenta como lo haría un cobrador de verdad.
     --------------------------------------------------------------- */
  :root {
    --kraft: #C7A876;
    --kraft-dark: #B08F5E;

    --paper: #FBF6E8;
    --paper-line: #DCCEA3;
    --paper-line-soft: #E9DFC0;

    --ink: #26201A;
    --ink-soft: #6E6350;
    --ink-faint: #9C927A;

    --green: #2E4A34;
    --green-deep: #1F3325;
    --green-soft: #E3E9DA;

    --rust: #93381C;
    --rust-soft: #EFDACB;

    --gold: #A67C2E;
  }

  * { box-sizing: border-box; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    font-family: 'Karla', sans-serif;
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 52px 14px;
    background-color: var(--kraft);
    background-image:
      radial-gradient(circle at 15% 20%, rgba(255,255,255,0.06) 0, transparent 45%),
      radial-gradient(circle at 85% 80%, rgba(0,0,0,0.08) 0, transparent 50%),
      linear-gradient(160deg, var(--kraft) 0%, var(--kraft-dark) 100%);
  }

  .card {
    width: 100%;
    max-width: 440px;
    background: var(--paper);
    padding: 38px 28px 30px;
    border-radius: 2px;
    position: relative;
    box-shadow:
      0 1px 0 rgba(255,255,255,0.4) inset,
      0 22px 40px -18px rgba(31, 24, 12, 0.55);
  }

  /* Borde perforado, como el corte de un recibo */
  .card::before {
    content: '';
    position: absolute;
    top: -9px; left: 0; right: 0;
    height: 18px;
    background-image: radial-gradient(circle at 9px 9px, var(--kraft-dark) 8px, transparent 8.5px);
    background-size: 18px 18px;
    background-position: 3px 0;
    opacity: 0.55;
  }

  h1 {
    font-family: 'Space Mono', monospace;
    font-size: 21px;
    line-height: 1.3;
    letter-spacing: -0.01em;
    margin: 0 0 6px;
    font-weight: 700;
    color: var(--green-deep);
  }
  .sub { font-size: 13.5px; color: var(--ink-soft); margin-bottom: 28px; line-height: 1.55; max-width: 34ch; }

  #login input {
    width: 100%;
    padding: 13px 14px;
    font-size: 15px;
    font-family: 'Space Mono', monospace;
    border: 1px solid var(--paper-line);
    background: #fff;
    border-radius: 2px;
    margin-bottom: 10px;
    color: var(--ink);
  }
  #login input::placeholder { color: var(--ink-faint); }
  #login input:focus, .field input:focus, .field select:focus {
    outline: none;
    border-color: var(--green);
    box-shadow: 0 0 0 3px var(--green-soft);
  }
  #login button, #submitNuevo {
    width: 100%;
    padding: 13px;
    background: var(--green-deep);
    color: var(--paper);
    border: none;
    border-radius: 2px;
    font-size: 14.5px;
    font-weight: 700;
    font-family: 'Karla', sans-serif;
    cursor: pointer;
    transition: background 0.15s ease;
    letter-spacing: 0.01em;
  }
  #login button:hover, #submitNuevo:hover { background: var(--green); }
  #login button:disabled, #submitNuevo:disabled { opacity: 0.5; cursor: default; }

  .error { color: var(--rust); font-size: 13px; margin-top: 9px; }
  .ok { color: var(--green); font-size: 13px; margin-top: 9px; }

  #resultado { display: none; }

  .saludo { font-size: 14.5px; color: var(--ink-soft); margin-bottom: 22px; }
  .saludo strong { color: var(--ink); font-weight: 700; }

  /* Sello de tinta con el estado de la cuenta */
  .estado {
    display: flex;
    align-items: center;
    gap: 18px;
    margin-bottom: 30px;
    padding-bottom: 26px;
    border-bottom: 1.5px dashed var(--paper-line);
  }
  .sello {
    flex-shrink: 0;
    width: 78px;
    height: 78px;
    border-radius: 50%;
    border: 2.5px solid currentColor;
    box-shadow: 0 0 0 4px var(--paper), 0 0 0 5px currentColor;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    font-family: 'Space Mono', monospace;
    font-weight: 700;
    font-size: 11px;
    letter-spacing: 0.4px;
    line-height: 1.35;
    transform: rotate(-8deg);
    mix-blend-mode: multiply;
    opacity: 0.88;
    padding: 6px;
    margin: 5px;
  }
  .sello.ok { color: var(--green); }
  .sello.debe { color: var(--rust); }
  .estado-texto { font-size: 13.5px; color: var(--ink-soft); line-height: 1.55; }
  .estado-texto strong { color: var(--ink); font-weight: 700; }

  h2.titulo-seccion {
    font-family: 'Space Mono', monospace;
    font-size: 12.5px;
    margin: 0 0 16px;
    color: var(--ink-soft);
    font-weight: 700;
    letter-spacing: 0.02em;
  }

  #formNuevo {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 8px;
  }
  .field { display: flex; flex-direction: column; gap: 5px; }
  .field.full { grid-column: 1 / -1; }
  .field label { font-size: 11.5px; color: var(--ink-soft); }
  .field input, .field select {
    font-family: 'Karla', sans-serif;
    font-size: 14px;
    padding: 10px 10px;
    border: 1px solid var(--paper-line);
    background: #fff;
    border-radius: 2px;
    color: var(--ink);
  }
  .voucher-picker { display: flex; align-items: center; gap: 10px; }
  .voucher-picker label.btn {
    font-size: 12.5px; padding: 9px 13px; border: 1px solid var(--ink);
    border-radius: 2px; cursor: pointer; background: #fff; white-space: nowrap;
    transition: background 0.15s ease, border-color 0.15s ease;
  }
  .voucher-picker label.btn:hover { background: var(--green-soft); border-color: var(--green); }
  .voucher-preview { font-size: 11.5px; color: var(--ink-soft); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #submitNuevo { grid-column: 1 / -1; margin-top: 4px; }
  #msgNuevo { grid-column: 1/-1; font-size: 12px; }

  .aldia-msg {
    background: var(--green-soft);
    border: 1px dashed var(--paper-line);
    border-radius: 2px;
    padding: 16px;
    font-size: 13px;
    color: var(--green-deep);
    text-align: center;
    line-height: 1.5;
  }

  .rule { border: none; border-top: 1.5px dashed var(--paper-line); margin: 28px 0 18px; }

  /* Historial colapsable, con textura de hoja rayada */
  details.historial summary {
    cursor: pointer;
    font-size: 13px;
    font-family: 'Space Mono', monospace;
    font-weight: 700;
    color: var(--ink-soft);
    list-style: none;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 4px 0;
  }
  details.historial summary::-webkit-details-marker { display: none; }
  details.historial summary::after {
    content: '+';
    font-family: 'Space Mono', monospace;
    font-size: 17px;
    color: var(--gold);
    transition: transform 0.15s ease;
  }
  details.historial[open] summary::after { transform: rotate(45deg); }

  .total {
    font-family: 'Space Mono', monospace;
    font-size: 21px;
    font-weight: 700;
    color: var(--green-deep);
    margin: 18px 0 4px;
  }

  #lista {
    margin-top: 10px;
    background-image: repeating-linear-gradient(
      var(--paper),
      var(--paper) 38px,
      var(--paper-line-soft) 39px,
      var(--paper) 40px
    );
  }
  .pago { padding: 11px 2px; border-bottom: 1px dotted var(--paper-line); }
  .pago:last-child { border-bottom: none; }
  .fila { display: flex; justify-content: space-between; font-family: 'Space Mono', monospace; font-size: 13.5px; }
  .monto { font-weight: 700; color: var(--green-deep); }
  .comentario { font-size: 13px; color: var(--ink-soft); margin-top: 4px; }
  .pago img { max-width: 100%; margin-top: 8px; border-radius: 2px; border: 1px solid var(--paper-line); cursor: pointer; }

  .salir {
    margin-top: 24px;
    background: none;
    border: none;
    color: var(--ink-soft);
    text-decoration: underline;
    text-underline-offset: 2px;
    cursor: pointer;
    font-size: 12.5px;
    padding: 0;
  }
  .salir:hover { color: var(--rust); }

  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(20,16,10,0.88);
    display: flex; align-items: center; justify-content: center;
    z-index: 50; padding: 20px;
  }
  .modal-backdrop img { max-width: 100%; max-height: 90vh; border-radius: 2px; }

  @media (max-width: 420px) {
    .card { padding: 30px 20px 24px; }
    #formNuevo { grid-template-columns: 1fr; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>
  <div class="card">
    <h1>Pagos de alquiler del local</h1>
    <div class="sub">Ingresa tu DNI para consultar tu cuenta o registrar un pago.</div>

    <div id="login">
      <input id="dni" placeholder="DNI" maxlength="8" inputmode="numeric" />
      <button id="btnConsultar">Consultar</button>
      <div class="error" id="err"></div>
    </div>

    <div id="resultado">
      <div class="saludo" id="saludo"></div>

      <div class="estado">
        <div class="sello" id="sello"></div>
        <div class="estado-texto" id="estadoTexto"></div>
      </div>

      <h2 class="titulo-seccion">Registrar pago</h2>
      <div id="aldiaMsg" class="aldia-msg" style="display:none">Ya no debes ningún mes. Cuando venza el siguiente, aparecerá aquí.</div>
      <form id="formNuevo">
        <div class="field full">
          <label for="fPeriodo">Mes que pagas</label>
          <select id="fPeriodo" required></select>
        </div>
        <div class="field">
          <label for="fMonto">Monto (S/)</label>
          <input type="number" id="fMonto" step="0.01" min="0" placeholder="0.00" required />
        </div>
        <div class="field">
          <label for="fComentario">Comentario (opcional)</label>
          <input id="fComentario" placeholder="Opcional" />
        </div>
        <div class="field full">
          <label>Voucher de Yape (opcional)</label>
          <div class="voucher-picker">
            <label class="btn" for="fVoucher">Adjuntar imagen</label>
            <input type="file" id="fVoucher" accept="image/*" style="display:none" />
            <span class="voucher-preview" id="voucherPreviewText">Ningún archivo</span>
          </div>
        </div>
        <button type="submit" id="submitNuevo">Guardar pago</button>
        <div id="msgNuevo"></div>
      </form>

      <hr class="rule" />

      <details class="historial" id="historialDetails">
        <summary>Ver historial de pagos</summary>
        <div class="total" id="total"></div>
        <div id="lista"></div>
      </details>

      <button class="salir" id="btnSalir">Salir</button>
    </div>
  </div>

  <div id="modalRoot"></div>

<script>
  // Reemplaza esta URL por la de tu propia implementación de Apps Script (termina en /exec)
  const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzjAOTIiqsQaslQQ4Js2fXjw2XZ5lIaEgEwAOaQntHOiC98ndz0-XpYek9t8OBcP_SC/exec';

  let dniActual = '';
  let pendingVoucherDataUrl = null;
  let pendingVoucherMime = null;

  const dniInput = document.getElementById('dni');
  const btn = document.getElementById('btnConsultar');
  const errEl = document.getElementById('err');
  const loginEl = document.getElementById('login');
  const resultadoEl = document.getElementById('resultado');
  const fPeriodo = document.getElementById('fPeriodo');
  const fMonto = document.getElementById('fMonto');
  const fVoucher = document.getElementById('fVoucher');
  const voucherPreviewText = document.getElementById('voucherPreviewText');
  const msgNuevo = document.getElementById('msgNuevo');
  const submitNuevo = document.getElementById('submitNuevo');
  const formNuevo = document.getElementById('formNuevo');
  const aldiaMsg = document.getElementById('aldiaMsg');
  const sello = document.getElementById('sello');
  const estadoTexto = document.getElementById('estadoTexto');

  async function consultar() {
    const dni = dniInput.value.trim();
    errEl.textContent = '';
    if (!dni) {
      errEl.textContent = 'Escribe tu DNI.';
      return;
    }
    btn.disabled = true;
    btn.textContent = 'Consultando…';
    try {
      const res = await fetch(`${APPS_SCRIPT_URL}?dni=${encodeURIComponent(dni)}`);
      const data = await res.json();
      if (!data.ok) {
        errEl.textContent = data.mensaje || 'DNI no autorizado.';
        return;
      }
      dniActual = dni;
      mostrar(data);
    } catch (e) {
      errEl.textContent = 'No se pudo conectar. Intenta de nuevo.';
    } finally {
      btn.disabled = false;
      btn.textContent = 'Consultar';
    }
  }

  function mostrar(data) {
    loginEl.style.display = 'none';
    resultadoEl.style.display = 'block';
    document.getElementById('saludo').innerHTML = 'Hola, <strong>' + data.nombre + '</strong>.';

    // Sello de estado
    const pendientes = data.pendientes || [];
    if (pendientes.length === 0) {
      sello.className = 'sello ok';
      sello.textContent = 'AL DÍA';
      estadoTexto.innerHTML = 'Tu cuenta está <strong>al día</strong>. No debes ningún mes.';
    } else {
      sello.className = 'sello debe';
      sello.textContent = pendientes.length + (pendientes.length === 1 ? ' MES' : ' MESES');
      estadoTexto.innerHTML = pendientes.length === 1
        ? 'Debes <strong>' + pendientes[0].label + '</strong>.'
        : 'Debes desde <strong>' + pendientes[0].label + '</strong> hasta <strong>' + pendientes[pendientes.length - 1].label + '</strong>.';
    }

    // Formulario de registro
    fPeriodo.innerHTML = '';
    if (pendientes.length === 0) {
      formNuevo.style.display = 'none';
      aldiaMsg.style.display = 'block';
    } else {
      formNuevo.style.display = 'grid';
      aldiaMsg.style.display = 'none';
      pendientes.forEach((p) => {
        const opt = document.createElement('option');
        opt.value = p.value;
        opt.textContent = p.label;
        fPeriodo.appendChild(opt);
      });
    }
    fMonto.value = data.montoSugerido || '';

    // Historial
    const total = data.pagos.reduce((s, p) => s + Number(p.monto || 0), 0);
    document.getElementById('total').textContent =
      'Total pagado: S/ ' + total.toLocaleString('es-PE', { minimumFractionDigits: 2 });

    const lista = document.getElementById('lista');
    lista.innerHTML = '';
    if (data.pagos.length === 0) {
      lista.innerHTML = '<div class="comentario">Todavía no hay pagos registrados.</div>';
    } else {
      data.pagos.forEach((p) => {
        const div = document.createElement('div');
        div.className = 'pago';
        div.innerHTML = `
          <div class="fila"><span>${p.fecha}</span><span class="monto">S/ ${Number(p.monto).toFixed(2)}</span></div>
          ${p.comentario ? `<div class="comentario">${escapeHtml(p.comentario)}</div>` : ''}
          ${p.voucherUrl ? `<img src="${p.voucherUrl}" alt="voucher" />` : ''}
        `;
        lista.appendChild(div);
        if (p.voucherUrl) {
          div.querySelector('img').addEventListener('click', () => openModal(p.voucherUrl));
        }
      });
    }
  }

  function openModal(src) {
    const root = document.getElementById('modalRoot');
    root.innerHTML = '';
    const backdrop = document.createElement('div');
    backdrop.className = 'modal-backdrop';
    backdrop.onclick = () => { root.innerHTML = ''; };
    const img = document.createElement('img');
    img.src = src;
    backdrop.appendChild(img);
    root.appendChild(backdrop);
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function compressImage(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          const maxW = 720;
          const scale = Math.min(1, maxW / img.width);
          const canvas = document.createElement('canvas');
          canvas.width = img.width * scale;
          canvas.height = img.height * scale;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          resolve(canvas.toDataURL('image/jpeg', 0.72));
        };
        img.onerror = () => reject(new Error('No se pudo leer la imagen'));
        img.src = e.target.result;
      };
      reader.onerror = () => reject(new Error('No se pudo leer el archivo'));
      reader.readAsDataURL(file);
    });
  }

  fVoucher.addEventListener('change', async () => {
    const file = fVoucher.files[0];
    if (!file) {
      pendingVoucherDataUrl = null;
      voucherPreviewText.textContent = 'Ningún archivo';
      return;
    }
    voucherPreviewText.textContent = 'Procesando…';
    try {
      pendingVoucherDataUrl = await compressImage(file);
      pendingVoucherMime = 'image/jpeg';
      voucherPreviewText.textContent = file.name;
    } catch (err) {
      pendingVoucherDataUrl = null;
      voucherPreviewText.textContent = 'Error al procesar la imagen';
    }
  });

  formNuevo.addEventListener('submit', async (e) => {
    e.preventDefault();
    msgNuevo.textContent = '';
    msgNuevo.className = '';

    const periodo = fPeriodo.value;
    const monto = parseFloat(fMonto.value);
    const comentario = document.getElementById('fComentario').value.trim();

    if (!periodo || isNaN(monto) || monto <= 0) {
      msgNuevo.textContent = 'Selecciona el mes y un monto válido.';
      msgNuevo.className = 'error';
      return;
    }

    submitNuevo.disabled = true;
    submitNuevo.textContent = 'Guardando…';

    try {
      const payload = {
        dni: dniActual,
        periodo,
        monto,
        comentario,
        imagenBase64: pendingVoucherDataUrl || '',
        mimeType: pendingVoucherMime || ''
      };

      const res = await fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify(payload)
      });
      const data = await res.json();

      if (!data.ok) {
        msgNuevo.textContent = data.mensaje || 'No se pudo guardar.';
        msgNuevo.className = 'error';
        return;
      }

      msgNuevo.textContent = 'Pago guardado correctamente.';
      msgNuevo.className = 'ok';
      document.getElementById('fComentario').value = '';
      fVoucher.value = '';
      pendingVoucherDataUrl = null;
      voucherPreviewText.textContent = 'Ningún archivo';

      await consultarSilencioso();
    } catch (err) {
      msgNuevo.textContent = 'Ocurrió un error de conexión.';
      msgNuevo.className = 'error';
    } finally {
      submitNuevo.disabled = false;
      submitNuevo.textContent = 'Guardar pago';
    }
  });

  async function consultarSilencioso() {
    try {
      const res = await fetch(`${APPS_SCRIPT_URL}?dni=${encodeURIComponent(dniActual)}`);
      const data = await res.json();
      if (data.ok) mostrar(data);
    } catch (e) {}
  }

  btn.addEventListener('click', consultar);
  dniInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') consultar(); });

  document.getElementById('btnSalir').addEventListener('click', () => {
    resultadoEl.style.display = 'none';
    loginEl.style.display = 'block';
    dniInput.value = '';
    dniActual = '';
  });
</script>
</body>
</html>
